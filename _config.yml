title: Full Stack Data Lab
tagline: Bringing AI to Data Analysis and BI
description: "A CS research lab led by Shreya Shankar, moving to Carnegie Mellon University in 2027. We build open-source data systems so AI can power data analysis: DocETL, Quail, and DocWriter."
url: https://fsdatalab.github.io
baseurl: ""
image:
  path: /assets/og-image.png
  width: 1200
  height: 630
  alt: "Full Stack Data Lab, Carnegie Mellon University"
future: true

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-image.png
        width: 1200
        height: 630
        alt: "Full Stack Data Lab, Carnegie Mellon University"
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
  - scope:
      path: "assets"
    values:
      sitemap: false

# Search Console ownership check; jekyll-seo-tag writes the meta tag.
webmaster_verifications:
  google: mJgeyiDr8gFrqRtKupluGxveJ11c9uVsxoZkF-Cp--4

# Structured data on the home page (_includes/structured-data.html).
lab_founders:
  - shreya-shankar
lab_profiles:
  - https://github.com/fsdatalab

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

# Kit (ConvertKit) newsletter. Set to your form's numeric ID to show the
# signup box; leave empty to hide it.
kit_form_id: "9989605"
