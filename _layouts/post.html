---
layout: default
---
<article class="content-narrow prose">
  <a href="{{ '/blog/' | relative_url }}" class="back-link">← Blog</a>
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">{{ page.date | date: "%b %-d, %Y" }}{% if page.author %} | {{ page.author }}{% endif %}</div>
  </div>
  {{ content }}
</article>
