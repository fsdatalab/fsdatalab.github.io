# Names and sites the tracker looks for in each answer.
#
# patterns are Python regular expressions, matched case-insensitively unless
# case_sensitive is true. Quail is case-sensitive so the bird does not count.

ours:
  Quail:
    case_sensitive: true
    patterns: ['\bQuail\b', '\bQUAIL\b', 'QUAIL-B', 'fsdatalab/quail']
  DocETL:
    patterns: ['\bDocETL\b', 'docetl\.org']
  DocWriter:
    patterns: ['\bDocWriter\b', 'docwriter\.org']
  Full Stack Data Lab:
    patterns: ['Full Stack Data Lab', '\bfsdatalab\b']
  Shreya Shankar:
    patterns: ['Shreya Shankar']

# A cited URL counts as ours if its host and path start with one of these.
our_sources:
  - fsdatalab.github.io
  - github.com/fsdatalab
  - docetl.org
  - docwriter.org
  - sh-reya.com

# What people pick instead. For Quail that is the AI functions built into
# their warehouse, plus the inference engines they would wire up themselves.
competitors:
  Snowflake Cortex:
    patterns: ['\bCortex\b', '\bAISQL\b', '\bAI_COMPLETE\b', '\bAI_CLASSIFY\b', '\bAI_FILTER\b', '\bAI_AGG\b']
  Databricks AI Functions:
    patterns: ['\bai_query\b', '\bai_classify\b', '\bai_extract\b', 'Databricks AI Functions']
  BigQuery AI:
    patterns: ['\bAI\.GENERATE\b', '\bML\.GENERATE_TEXT\b', '\bAI\.CLASSIFY\b', '\bAI\.IF\b', 'BigQuery ML']
  Redshift / Bedrock:
    patterns: ['Redshift ML', '\bBedrock\b']
  pgai:
    patterns: ['\bpgai\b']
  vLLM:
    patterns: ['\bvLLM\b']
  SGLang:
    patterns: ['\bSGLang\b']
  Ray Data:
    patterns: ['Ray Data']
