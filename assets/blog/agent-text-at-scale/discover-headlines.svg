<title id="t1">Headlines from the Perplexity Discover feed</title>
<desc id="d1">A stylized Perplexity Discover feed with one lead story and three story cards. Each headline has a subject, a verb in the present tense, and an object.</desc>
<style>.page{fill:#fcfcf9;stroke:#d0d5dd;stroke-width:1.2} .img{fill:#e4e7ec} .card{fill:#fff;stroke:#e4e7ec;stroke-width:1} .nav{fill:#101828;font:500 14px Inter, sans-serif} .muted{fill:#667085;font:400 14px Inter, sans-serif} .hero{fill:#101828;font:400 20px Georgia, "Times New Roman", serif} .h{fill:#101828;font:400 14px Georgia, "Times New Roman", serif} .sum{fill:#344054;font:400 14px Georgia, "Times New Roman", serif} .src{fill:#667085;font:400 14px Inter, sans-serif} .fav{stroke:#fff;stroke-width:1.2}</style>
