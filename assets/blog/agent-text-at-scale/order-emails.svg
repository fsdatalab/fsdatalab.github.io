<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 175" role="img" aria-labelledby="t1 d1">
<title id="t1">Order emails with the status last and with the status first</title>
<desc id="d1">Left: an inbox with four order emails whose subject lines all start with "Your order" and end with the status. Right: four Amazon order emails whose subject lines start with the status, e.g., "Shipped:" or "Delivered:".</desc>
<style>.panel{fill:#fff;stroke:#d0d5dd;stroke-width:1.2} .side{fill:#faf9f5;stroke:#d0d5dd;stroke-width:1.2} .row{stroke:#eaecf0;stroke-width:1} .colhead{fill:#101828;font:600 14px Inter, sans-serif;text-anchor:middle} .group{fill:#8a8780;font:500 14px Inter, sans-serif} .t{fill:#1f1e1d;font:400 14px Inter, sans-serif;dominant-baseline:middle} .sender{fill:#1f1e1d;font:500 14px Inter, sans-serif;dominant-baseline:middle} .date{fill:#667085;font:400 14px Inter, sans-serif;dominant-baseline:middle;text-anchor:end} .icon,.box{fill:none;stroke:#a3a09a;stroke-width:1.2}</style>
