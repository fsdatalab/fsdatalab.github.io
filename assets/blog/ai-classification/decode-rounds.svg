<title id="title6">Steps of trie_decode</title>
<desc id="desc6">Ten documents, each of which gets a different label. Step 0 selects the first label token at the ANSWER token. Only the documents that selected refund or shipping need step 1. Every other document has its label after step 0.</desc>
