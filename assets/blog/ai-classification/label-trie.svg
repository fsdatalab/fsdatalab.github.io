<svg xmlns="http://www.w3.org/2000/svg" viewBox="29 98 1061 637" role="img" aria-labelledby="title desc">
<title id="title">Label trie for the running example</title>
<desc id="desc">The trie of the 10 support labels. The ANSWER token is the root. The labels branch at three nodes: the ANSWER token, refund, and shipping. Each label ends at a leaf.</desc>
