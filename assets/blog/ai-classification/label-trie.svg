  .leaf { fill: #ffffff; stroke: #667085; stroke-width: 2; stroke-dasharray: 6 5; }
  .end { fill: #ffffff; stroke: #101828; stroke-width: 3; }
  .edge { fill: none; stroke: #667085; stroke-width: 2; }
  .heading { fill: #101828; font: 600 25px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
  .colhead { fill: #101828; font: 600 20px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
  .label { fill: #101828; font: 500 20px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
  .left { fill: #101828; font: 500 20px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: start; dominant-baseline: middle; }
  .note { fill: #3b6ea8; font: 600 21px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
</style>
