<text class="left" style="dominant-baseline:auto" x="66" y="379.0">- <tspan style="fill:#3b6ea8;font-weight:700">C</tspan>: refund status</text>
<rect class="doc" x="50" y="394" width="440" height="32" rx="8"/>
<text class="left" style="dominant-baseline:auto" x="66" y="417.0">- <tspan style="fill:#3b6ea8;font-weight:700">D</tspan>: shipping delay</text>
