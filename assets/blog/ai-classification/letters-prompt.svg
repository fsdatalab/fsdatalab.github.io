<rect class="doc" x="50" y="280" width="440" height="32" rx="8"/>
<text class="left" style="dominant-baseline:auto" x="66" y="303.0">- <tspan style="fill:#3b6ea8;font-weight:700">A</tspan>: billing</text>
<rect class="doc" x="50" y="318" width="440" height="32" rx="8"/>
<text class="left" style="dominant-baseline:auto" x="66" y="341.0">- <tspan style="fill:#3b6ea8;font-weight:700">B</tspan>: refund request</text>
