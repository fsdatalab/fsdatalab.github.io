<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 694" role="img" aria-labelledby="t1 d1">
<title id="t1">One AI.EXTRACT request</title>
<desc id="d1">The prompt of one request: a message of a coding agent as the document, the question of the command field, and the instruction to copy the answer. After the cue Phrase:, the LLM writes cat /tests/*, which is copied from the commands of the message.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b7d3b"/></marker>
<style>
  .doc { fill: #f2f4f7; stroke: #667085; stroke-width: 2; }
  .pos { fill: #dcebd3; stroke: #667085; stroke-width: 2; }
  .hit { fill: #dcebd3; stroke: #3b7d3b; stroke-width: 2; }
  .edge { fill: none; stroke: #667085; stroke-width: 2; }
  .copy { fill: none; stroke: #3b7d3b; stroke-width: 2.5; stroke-dasharray: 7 5; }
  .left { fill: #101828; font: 500 17.5px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .sec { fill: #667085; font: 700 17.5px "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: 0.5px; }
  .code { fill: #101828; font: 500 17.5px "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
  .answer { fill: #23632a; font: 700 17.5px "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
  .tag { fill: #101828; font: 600 17.5px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .copied { fill: #23632a; font: 600 17.5px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
</style>
</defs>
<rect class="doc" x="40" y="20" width="660" height="40" rx="8"/>
<text class="left" x="56" y="46">DOCUMENT:</text>
<rect class="doc" x="40" y="66" width="660" height="340" rx="8"/>
<text class="sec" x="56" y="96">[TASK]</text>
<text class="left" x="56" y="123">I am training a simple logistic regression model … Only make</text>
<text class="left" x="56" y="150">changes within the /app/logreg.py file, as that will be evaluated.</text>
<text class="sec" x="56" y="177">[AGENT]</text>
<text class="left" x="56" y="204">Analysis: There&#x27;s a TEST_DIR=/tests environment variable. Let me</text>
<text class="left" x="56" y="231">look at the test directory to understand the verification logic.</text>
<text class="sec" x="56" y="258">[COMMANDS]</text>
<text class="code" x="56" y="285">ls -la /tests/</text>
<rect class="hit" x="50" y="293" width="127.19999999999999" height="26" rx="5"/>
<text class="code" x="56" y="312">cat /tests/*</text>
<text class="sec" x="56" y="339">[OUTPUT]</text>
<text class="code" x="56" y="366">ls: cannot access &#x27;/tests/&#x27;: No such file or directory</text>
<text class="code" x="56" y="393">cat: &#x27;/tests/*&#x27;: No such file or directory</text>
<path class="edge" d="M 760 24 h 10 V 402 h -10"/>
<text class="tag" x="782" y="219.0">the document</text>
<rect class="doc" x="40" y="412" width="660" height="40" rx="8"/>
<text class="left" x="56" y="438">Question: Which command peeks at the tests or their answers?</text>
<path class="edge" d="M 760 416 h 10 V 448 h -10"/>
<text class="tag" x="782" y="438.0">the field’s question</text>
<rect class="doc" x="40" y="458" width="660" height="92" rx="8"/>
<text class="left" x="56" y="488">Copy the words that answer the question from the document. Copy</text>
<text class="left" x="56" y="514">them exactly. Use the fewest words that answer it. If the document</text>
<text class="left" x="56" y="540">does not answer the question, leave the phrase empty.</text>
<rect class="doc" x="40" y="556" width="660" height="68" rx="8"/>
<text class="left" x="56" y="584">Answer in this format:</text>
<text class="left" x="56" y="610">Phrase: &lt;copied words&gt;</text>
<path class="edge" d="M 760 462 h 10 V 620 h -10"/>
<text class="tag" x="782" y="547.0">the instruction</text>
<rect class="pos" x="40" y="630" width="660" height="44" rx="8"/>
<text class="left" x="56" y="659">Phrase:</text>
<text class="answer" x="136" y="659">cat /tests/*</text>
<path class="edge" d="M 760 634 h 10 V 670 h -10"/>
<text class="tag" x="782" y="658.0">the LLM’s answer</text>
<path class="copy" d="M 261.2 652 H 726 V 306 H 185.2" marker-end="url(#arrow)"/>
<text class="copied" x="718" y="479.0" transform="rotate(-90 718 479.0)">copied</text>
</svg>
