<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2576 770" width="2576" height="770" role="img" aria-label="A database instance of four IMDB reviews, an AI_IF conjunction query applying three predicates, and the resulting table of TRUE/FALSE/— outcomes per review." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#667085"/>
    </marker>
    <style>
      .serif { font-family: "Lora", Georgia, "Times New Roman", serif; fill: #344054; font-size: 35px; }
      .bold { fill: #101828; font-weight: bold; }
      .cap { font-size: 33px; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #344054; font-size: 26.5px; }
      .kw { fill: #a31545; font-weight: bold; }
      .fn { fill: #245f9e; font-weight: bold; }
      .str { fill: #287a4d; }
      .box { fill: none; stroke: #667085; stroke-width: 2; }
      .thick { stroke: #667085; stroke-width: 4; }
      .thin { stroke: #667085; stroke-width: 2; }
      .mid { text-anchor: middle; }
      .sub { font-size: 24px; }
    </style>
  </defs>

  <rect width="2576" height="770" fill="none"/>

  <!-- Database instance -->
  <rect class="box" x="15" y="127" width="856" height="454" rx="18"/>
  <text class="serif bold" x="38" y="177">Reviews</text>
  <line class="thick" x1="38" y1="198" x2="840" y2="198"/>
  <text class="serif bold" x="38" y="238">id</text>
  <text class="serif bold" x="154" y="238">body</text>
  <line class="thin" x1="38" y1="257" x2="840" y2="257"/>

  <text class="serif" x="38" y="297">rv1</text>
  <text class="serif" x="154" y="297" textLength="686" lengthAdjust="spacing">Tom Hanks gives a great performance, and the end-</text>
  <text class="serif" x="154" y="337">ing is a satisfying surprise.</text>

  <text class="serif" x="38" y="377">rv2</text>
  <text class="serif" x="154" y="377" textLength="686" lengthAdjust="spacing">Gorgeous cinematography and a wonderful score</text>
  <text class="serif" x="154" y="417">throughout.</text>

  <text class="serif" x="38" y="458">rv3</text>
  <text class="serif" x="154" y="458" textLength="686" lengthAdjust="spacing">I loved the twist at the end, but nobody in the cast</text>
  <text class="serif" x="154" y="498">stood out.</text>

  <text class="serif" x="38" y="538">rv4</text>
  <text class="serif" x="154" y="538" textLength="686" lengthAdjust="spacing">Dull plot, wooden acting, and a waste of two hours.</text>
  <line class="thick" x1="38" y1="557" x2="840" y2="557"/>

  <text class="serif cap mid" x="443" y="632">Database Instance</text>

  <!-- Arrows -->
  <line class="thin" x1="871" y1="353" x2="1036" y2="353" marker-end="url(#arrow)"/>
  <line class="thin" x1="1777" y1="353" x2="1943" y2="353" marker-end="url(#arrow)"/>

  <!-- Query -->
  <rect class="box" x="1038" y="15" width="739" height="678" rx="18"/>
  <g class="mono">
    <text x="1061" y="52"><tspan class="kw">SELECT</tspan><tspan> id, body</tspan></text>
    <text x="1061" y="81"><tspan class="kw">FROM</tspan><tspan> reviews</tspan></text>
    <text x="1061" y="110"><tspan class="kw">WHERE</tspan><tspan> </tspan><tspan class="fn">AI_IF</tspan><tspan>(</tspan></text>
    <text x="1088" y="139"><tspan class="fn">PROMPT</tspan><tspan>(</tspan></text>
    <text class="str" x="1115" y="168">"DOCUMENT: {}</text>
    <text class="str" x="1115" y="198">Evaluate TRUE or FALSE for the following</text>
    <text class="str" x="1115" y="227">question:  Judge strictly from the review</text>
    <text class="str" x="1115" y="256">above whether it mentions at least one</text>
    <text class="str" x="1115" y="286">positive aspect of the movie.</text>
    <text class="str" x="1115" y="315">ANSWER:"</text>
    <text x="1088" y="344">), body</text>
    <text x="1061" y="373">)</text>
    <text x="1061" y="402"><tspan class="kw">AND</tspan><tspan> </tspan><tspan class="fn">AI_IF</tspan><tspan>(</tspan></text>
    <text x="1088" y="432"><tspan class="fn">PROMPT</tspan><tspan>(</tspan><tspan class="str">"DOCUMENT: {} ...  whether it</tspan></text>
    <text class="str" x="1088" y="461">discusses the ending of the movie.</text>
    <text x="1088" y="490"><tspan class="str">ANSWER:"</tspan><tspan>), body</tspan></text>
    <text x="1061" y="519">)</text>
    <text x="1061" y="549"><tspan class="kw">AND</tspan><tspan> </tspan><tspan class="fn">AI_IF</tspan><tspan>(</tspan></text>
    <text x="1088" y="578"><tspan class="fn">PROMPT</tspan><tspan>(</tspan><tspan class="str">"DOCUMENT: {} ...  whether it</tspan></text>
    <text class="str" x="1088" y="607">mentions any specific actor or actress</text>
    <text x="1088" y="637"><tspan class="str">by name.  ANSWER:"</tspan><tspan>), body</tspan></text>
    <text x="1061" y="666">);</text>
  </g>
  <text class="serif cap mid" x="1407" y="744">AI Filter query</text>

  <!-- Result -->
  <rect class="box" x="1945" y="187" width="615" height="333" rx="18"/>
  <text class="serif bold" x="1968" y="238">Conjunction Result</text>
  <line class="thick" x1="1968" y1="258" x2="2530" y2="258"/>
  <text class="serif bold" x="1968" y="299">id</text>
  <text class="serif mid" x="2168" y="299" font-style="italic">F<tspan class="sub" dy="8">1</tspan></text>
  <text class="serif mid" x="2322" y="299" font-style="italic">F<tspan class="sub" dy="8">2</tspan></text>
  <text class="serif mid" x="2475" y="299" font-style="italic">F<tspan class="sub" dy="8">3</tspan></text>
  <line class="thin" x1="1968" y1="318" x2="2530" y2="318"/>

  <text class="serif" x="1968" y="358">rv1</text>
  <text class="serif mid" x="2168" y="358">TRUE</text>
  <text class="serif mid" x="2322" y="358">TRUE</text>
  <text class="serif mid" x="2475" y="358">TRUE</text>

  <text class="serif" x="1968" y="398">rv2</text>
  <text class="serif mid" x="2168" y="398">TRUE</text>
  <text class="serif mid" x="2322" y="398">FALSE</text>
  <text class="serif mid" x="2475" y="398">—</text>

  <text class="serif" x="1968" y="438">rv3</text>
  <text class="serif mid" x="2168" y="438">TRUE</text>
  <text class="serif mid" x="2322" y="438">TRUE</text>
  <text class="serif mid" x="2475" y="438">FALSE</text>

  <text class="serif" x="1968" y="478">rv4</text>
  <text class="serif mid" x="2168" y="478">FALSE</text>
  <text class="serif mid" x="2322" y="478">—</text>
  <text class="serif mid" x="2475" y="478">—</text>
  <line class="thick" x1="1968" y1="497" x2="2530" y2="497"/>

  <text class="serif cap mid" x="2252" y="572">Expected Output</text>
</svg>
