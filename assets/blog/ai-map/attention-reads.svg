<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="att-t att-d">
<title id="att-t">Copies of one trace KV tile from HBM into SRAM in one decode step</title>
<desc id="att-d">Left, standard attention: the same tile of the trace KV is copied from HBM into SRAM three times, once for each map. Right, shared-prefix attention: the tile is copied once and used by all three maps, and each map's result is then merged.</desc>
<defs>
<style>
  .mem { fill: #f9fafb; stroke: #d0d5dd; stroke-width: 2; }
  .tile { fill: #ffffff; stroke: #98a2b3; stroke-width: 2; }
  .hot { fill: #98a2b3; stroke: #667085; stroke-width: 2; }
  .hotg { fill: #3b7d3b; stroke: #2f6630; stroke-width: 2; }
  .slot { fill: #ffffff; stroke: #98a2b3; stroke-width: 2; }
  .merge { fill: #ffffff; stroke: #3b7d3b; stroke-width: 2; stroke-dasharray: 5 4; }
  .mergebox { fill: #dcebd3; stroke: #3b7d3b; stroke-width: 2; }
  .note { fill: #475467; font: 500 16.5px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .slotg { fill: #ffffff; stroke: #3b7d3b; stroke-width: 2; }
  .head { fill: #101828; font: 600 16.5px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .memlab { fill: #475467; font: 700 16.5px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .lab { fill: #101828; font: 500 16.5px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bad { fill: #475467; font: 700 16.5px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .good { fill: #3b7d3b; font: 700 16.5px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .ag { stroke: #667085; stroke-width: 2.5; fill: none; }
  .ac { stroke: #3b7d3b; stroke-width: 3; fill: none; }
</style>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker>
<marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b7d3b"/></marker>
</defs>

<!-- left: standard attention -->
<text class="head" x="225" y="26" text-anchor="middle">Standard attention</text>
<rect class="mem" x="15" y="40" width="420" height="84" rx="8"/>
<text class="memlab" x="28" y="62">HBM</text>
<text class="lab" x="28" y="100">trace KV</text>
<rect class="hot" x="130" y="70" width="56" height="40" rx="4"/>
<rect class="tile" x="192" y="70" width="56" height="40" rx="4"/>
<rect class="tile" x="254" y="70" width="56" height="40" rx="4"/>
<rect class="tile" x="316" y="70" width="56" height="40" rx="4"/>
<rect class="mem" x="15" y="182" width="420" height="96" rx="8"/>
<text class="memlab" x="28" y="204">SRAM</text>
<line class="ag" x1="158" y1="112" x2="95" y2="214" marker-end="url(#mg)"/>
<line class="ag" x1="158" y1="112" x2="225" y2="214" marker-end="url(#mg)"/>
<line class="ag" x1="158" y1="112" x2="355" y2="214" marker-end="url(#mg)"/>
<rect class="slot" x="40" y="218" width="110" height="46" rx="6"/>
<rect class="hot" x="50" y="228" width="26" height="26" rx="3"/>
<text class="lab" x="84" y="247">map 1</text>
<rect class="slot" x="170" y="218" width="110" height="46" rx="6"/>
<rect class="hot" x="180" y="228" width="26" height="26" rx="3"/>
<text class="lab" x="214" y="247">map 2</text>
<rect class="slot" x="300" y="218" width="110" height="46" rx="6"/>
<rect class="hot" x="310" y="228" width="26" height="26" rx="3"/>
<text class="lab" x="344" y="247">map 3</text>
<text class="bad" x="225" y="380" text-anchor="middle">each tile copied 3 times</text>

<!-- right: shared-prefix attention -->
<text class="head" x="675" y="26" text-anchor="middle">Shared-prefix attention (Quail)</text>
<rect class="mem" x="465" y="40" width="420" height="84" rx="8"/>
<text class="memlab" x="478" y="62">HBM</text>
<text class="lab" x="478" y="100">trace KV</text>
<rect class="hotg" x="580" y="70" width="56" height="40" rx="4"/>
<rect class="tile" x="642" y="70" width="56" height="40" rx="4"/>
<rect class="tile" x="704" y="70" width="56" height="40" rx="4"/>
<rect class="tile" x="766" y="70" width="56" height="40" rx="4"/>
<rect class="mem" x="465" y="182" width="420" height="96" rx="8"/>
<text class="memlab" x="478" y="204">SRAM</text>
<line class="ac" x1="608" y1="112" x2="608" y2="214" marker-end="url(#mc)"/>
<rect class="slotg" x="540" y="218" width="300" height="46" rx="6"/>
<rect class="hotg" x="550" y="228" width="26" height="26" rx="3"/>
<text class="lab" x="588" y="247">maps 1, 2, and 3</text>
<line class="ac" x1="600" y1="266" x2="600" y2="300" marker-end="url(#mc)"/>
<line class="ac" x1="690" y1="266" x2="690" y2="300" marker-end="url(#mc)"/>
<line class="ac" x1="780" y1="266" x2="780" y2="300" marker-end="url(#mc)"/>
<rect class="mergebox" x="558" y="304" width="84" height="34" rx="6"/>
<rect class="mergebox" x="648" y="304" width="84" height="34" rx="6"/>
<rect class="mergebox" x="738" y="304" width="84" height="34" rx="6"/>
<text class="lab" x="600" y="326" text-anchor="middle">merge</text>
<text class="lab" x="690" y="326" text-anchor="middle">merge</text>
<text class="lab" x="780" y="326" text-anchor="middle">merge</text>
<text class="good" x="675" y="380" text-anchor="middle">each tile copied once</text>
</svg>
