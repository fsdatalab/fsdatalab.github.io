<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="att-t att-d">
<title id="att-t">Tile loads of the shared trace KV in one decode step</title>
<desc id="att-d">The trace's KV is split into four tiles, T1 to T4. q1, q2, and q3 are the newest tokens of the three maps. Standard attention runs one call per map; each call loads all four tiles from GPU memory into on-chip memory, so one decode step loads 12 tiles. Shared-prefix attention runs one call that loads each tile once and scores it against all three queries, so it loads 4 tiles. Then each map's result is merged with its attention over its own instruction and output.</desc>
<defs>
<style>
  .kv { fill: #ffffff; stroke: #667085; stroke-width: 2; }
  .ld { fill: #eef0f3; stroke: #98a2b3; stroke-width: 2; }
  .sh { fill: #dcebd3; stroke: #3b7d3b; stroke-width: 2; }
  .mg { fill: #ffffff; stroke: #3b7d3b; stroke-width: 2; stroke-dasharray: 5 4; }
  .head { fill: #101828; font: 600 18px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .lab { fill: #101828; font: 500 15px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .cell { fill: #101828; font: 500 14px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .note { fill: #475467; font: 500 14px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bad { fill: #475467; font: 700 16px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .good { fill: #3b7d3b; font: 700 16px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .rule { stroke: #eaecf0; stroke-width: 2; }
</style>
</defs>

<!-- what is being read -->
<text class="lab" x="20" y="44">Trace KV in GPU memory (HBM)</text>
<rect class="kv" x="260" y="22" width="80" height="34" rx="5"/>
<rect class="kv" x="345" y="22" width="80" height="34" rx="5"/>
<rect class="kv" x="430" y="22" width="80" height="34" rx="5"/>
<rect class="kv" x="515" y="22" width="80" height="34" rx="5"/>
<text class="cell" x="300" y="44" text-anchor="middle">T1</text>
<text class="cell" x="385" y="44" text-anchor="middle">T2</text>
<text class="cell" x="470" y="44" text-anchor="middle">T3</text>
<text class="cell" x="555" y="44" text-anchor="middle">T4</text>
<text class="note" x="615" y="44">q₁, q₂, q₃ = newest token of maps 1, 2, 3</text>
<text class="note" x="20" y="82">A tile is a block of the trace's keys and values. Attention copies one tile at a time</text>
<text class="note" x="20" y="100">into on-chip memory (SRAM) and scores it against the queries.</text>
<line class="rule" x1="20" y1="118" x2="880" y2="118"/>

<g transform="translate(0,20)">
<!-- standard attention -->
<text class="head" x="20" y="136">Standard attention</text>
<text class="note" x="20" y="158">one call per map</text>
<text class="lab" x="20" y="197">call 1: q₁</text>
<text class="lab" x="20" y="241">call 2: q₂</text>
<text class="lab" x="20" y="285">call 3: q₃</text>
<g>
<rect class="ld" x="110" y="176" width="72" height="32" rx="5"/><text class="cell" x="146" y="197" text-anchor="middle">load T1</text>
<rect class="ld" x="188" y="176" width="72" height="32" rx="5"/><text class="cell" x="224" y="197" text-anchor="middle">load T2</text>
<rect class="ld" x="266" y="176" width="72" height="32" rx="5"/><text class="cell" x="302" y="197" text-anchor="middle">load T3</text>
<rect class="ld" x="344" y="176" width="72" height="32" rx="5"/><text class="cell" x="380" y="197" text-anchor="middle">load T4</text>
<rect class="ld" x="110" y="220" width="72" height="32" rx="5"/><text class="cell" x="146" y="241" text-anchor="middle">load T1</text>
<rect class="ld" x="188" y="220" width="72" height="32" rx="5"/><text class="cell" x="224" y="241" text-anchor="middle">load T2</text>
<rect class="ld" x="266" y="220" width="72" height="32" rx="5"/><text class="cell" x="302" y="241" text-anchor="middle">load T3</text>
<rect class="ld" x="344" y="220" width="72" height="32" rx="5"/><text class="cell" x="380" y="241" text-anchor="middle">load T4</text>
<rect class="ld" x="110" y="264" width="72" height="32" rx="5"/><text class="cell" x="146" y="285" text-anchor="middle">load T1</text>
<rect class="ld" x="188" y="264" width="72" height="32" rx="5"/><text class="cell" x="224" y="285" text-anchor="middle">load T2</text>
<rect class="ld" x="266" y="264" width="72" height="32" rx="5"/><text class="cell" x="302" y="285" text-anchor="middle">load T3</text>
<rect class="ld" x="344" y="264" width="72" height="32" rx="5"/><text class="cell" x="380" y="285" text-anchor="middle">load T4</text>
</g>
<text class="bad" x="20" y="376">12 tile loads</text>

<!-- shared-prefix attention -->
<line class="rule" x1="450" y1="118" x2="450" y2="384"/>
<text class="head" x="480" y="136">Shared-prefix attention (Quail)</text>
<text class="note" x="480" y="158">one call for all three maps, then a merge per map</text>
<text class="lab" x="480" y="197">call 1:</text>
<text class="lab" x="480" y="215">q₁, q₂, q₃</text>
<rect class="sh" x="570" y="176" width="72" height="32" rx="5"/><text class="cell" x="606" y="197" text-anchor="middle">load T1</text>
<rect class="sh" x="648" y="176" width="72" height="32" rx="5"/><text class="cell" x="684" y="197" text-anchor="middle">load T2</text>
<rect class="sh" x="726" y="176" width="72" height="32" rx="5"/><text class="cell" x="762" y="197" text-anchor="middle">load T3</text>
<rect class="sh" x="804" y="176" width="72" height="32" rx="5"/><text class="cell" x="840" y="197" text-anchor="middle">load T4</text>
<text class="note" x="570" y="232">each tile is scored against q₁, q₂, and q₃</text>
<text class="lab" x="480" y="285">merge:</text>
<rect class="mg" x="570" y="264" width="98" height="32" rx="5"/><text class="cell" x="619" y="285" text-anchor="middle">map 1</text>
<rect class="mg" x="674" y="264" width="98" height="32" rx="5"/><text class="cell" x="723" y="285" text-anchor="middle">map 2</text>
<rect class="mg" x="778" y="264" width="98" height="32" rx="5"/><text class="cell" x="827" y="285" text-anchor="middle">map 3</text>
<text class="note" x="570" y="320">combine with attention over the map's own</text>
<text class="note" x="570" y="338">instruction and output so far</text>
<text class="good" x="480" y="376">4 tile loads</text>
</g>
</svg>
