<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="att-t att-d">
<title id="att-t">What each map's attention reads in one decode step</title>
<desc id="att-d">Left, standard attention: each of the three maps reads the whole trace KV and then its own instruction and output, so the trace KV is read from GPU memory three times. Right, shared-prefix attention: the trace KV is read once for all three maps, each map reads its own instruction and output separately, and the two results are merged for each map.</desc>
<defs>
<style>
  .tr { fill: #d0d5dd; stroke: #98a2b3; stroke-width: 2; }
  .trg { fill: #dcebd3; stroke: #3b7d3b; stroke-width: 2; }
  .own { fill: #dbe7f5; stroke: #3b6ea8; stroke-width: 2; }
  .mg { fill: #ffffff; stroke: #3b7d3b; stroke-width: 2; }
  .head { fill: #101828; font: 600 18px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .lab { fill: #101828; font: 500 15px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .in { fill: #101828; font: 500 14px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bad { fill: #475467; font: 700 16px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .good { fill: #3b7d3b; font: 700 16px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .key { fill: #475467; font: 500 14px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .ac { stroke: #3b7d3b; stroke-width: 2.5; fill: none; }
  .ab { stroke: #3b6ea8; stroke-width: 2.5; fill: none; }
</style>
<marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b7d3b"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b6ea8"/></marker>
</defs>

<!-- left: standard attention -->
<text class="head" x="20" y="28">Standard attention</text>
<text class="lab" x="20" y="80">map 1</text>
<text class="lab" x="20" y="128">map 2</text>
<text class="lab" x="20" y="176">map 3</text>
<rect class="tr" x="80" y="60" width="250" height="30" rx="4"/><text class="in" x="205" y="80" text-anchor="middle">trace KV</text>
<rect class="own" x="334" y="60" width="66" height="30" rx="4"/>
<rect class="tr" x="80" y="108" width="250" height="30" rx="4"/><text class="in" x="205" y="128" text-anchor="middle">trace KV</text>
<rect class="own" x="334" y="108" width="66" height="30" rx="4"/>
<rect class="tr" x="80" y="156" width="250" height="30" rx="4"/><text class="in" x="205" y="176" text-anchor="middle">trace KV</text>
<rect class="own" x="334" y="156" width="66" height="30" rx="4"/>
<text class="bad" x="20" y="232">trace KV read 3 times</text>

<!-- right: shared-prefix attention -->
<text class="head" x="470" y="28">Shared-prefix attention (Quail)</text>
<text class="lab" x="470" y="80">maps 1–3</text>
<rect class="trg" x="560" y="60" width="210" height="30" rx="4"/><text class="in" x="665" y="80" text-anchor="middle">trace KV</text>
<text class="lab" x="470" y="128">map 1</text>
<text class="lab" x="470" y="176">map 2</text>
<text class="lab" x="470" y="224">map 3</text>
<rect class="own" x="560" y="108" width="66" height="30" rx="4"/>
<rect class="own" x="560" y="156" width="66" height="30" rx="4"/>
<rect class="own" x="560" y="204" width="66" height="30" rx="4"/>
<path class="ac" d="M770,75 H870 V219"/>
<line class="ac" x1="870" y1="123" x2="830" y2="123" marker-end="url(#mc)"/>
<line class="ac" x1="870" y1="171" x2="830" y2="171" marker-end="url(#mc)"/>
<line class="ac" x1="870" y1="219" x2="830" y2="219" marker-end="url(#mc)"/>
<line class="ab" x1="628" y1="123" x2="758" y2="123" marker-end="url(#mb)"/>
<line class="ab" x1="628" y1="171" x2="758" y2="171" marker-end="url(#mb)"/>
<line class="ab" x1="628" y1="219" x2="758" y2="219" marker-end="url(#mb)"/>
<rect class="mg" x="762" y="108" width="64" height="30" rx="4"/><text class="in" x="794" y="128" text-anchor="middle">merge</text>
<rect class="mg" x="762" y="156" width="64" height="30" rx="4"/><text class="in" x="794" y="176" text-anchor="middle">merge</text>
<rect class="mg" x="762" y="204" width="64" height="30" rx="4"/><text class="in" x="794" y="224" text-anchor="middle">merge</text>
<text class="good" x="470" y="268">trace KV read once</text>

<!-- key -->
<rect class="own" x="20" y="262" width="22" height="16" rx="3"/>
<text class="key" x="50" y="275">the map's own instruction and output</text>
</svg>
