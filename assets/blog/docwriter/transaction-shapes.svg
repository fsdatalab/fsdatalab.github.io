<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 430" role="img" aria-labelledby="title2 desc2">
<title id="title2">Human transactions compared with agent transactions</title>
<desc id="desc2">Top: two human writers make many small transactions over time. Bottom: a user makes many small transactions, while an agent makes one long transaction that reads at the start and writes at the end.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker>
<style>
  .lane { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.5; }
  .tx { fill: #f2f4f7; stroke: #667085; stroke-width: 2; }
  .read { fill: #b9dca8; stroke: #667085; stroke-width: 2; }
  .think { fill: #ffffff; stroke: #667085; stroke-width: 2; stroke-dasharray: 6 5; }
  .write { fill: #aecbee; stroke: #667085; stroke-width: 2; }
  .rd { fill: #b9dca8; }
  .wr { fill: #aecbee; }
  .outline { fill: none; stroke: #667085; stroke-width: 1.5; }
  .axis { fill: none; stroke: #667085; stroke-width: 2; }
  .panel { fill: #101828; font: 600 19px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: start; }
  .lanehead { fill: #101828; font: 600 19px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: start; dominant-baseline: middle; }
  .label { fill: #101828; font: 500 19px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
  .small { fill: #475467; font: 500 19px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: end; }
</style>
