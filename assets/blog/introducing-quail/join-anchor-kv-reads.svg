<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 440" role="img" aria-labelledby="title desc">
<title id="title">Anchor KV reads in an AI join</title>
<desc id="desc">In vLLM, each anchor and partner pair is a separate sequence, so attention reads the same anchor KV once per partner. In Quail, partners that share an anchor are grouped, so attention reads the anchor KV once.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker>
<style>
  .frame { fill: #ffffff; stroke: #667085; stroke-width: 2; }
  .anchor { fill: #f2f4f7; stroke: #667085; stroke-width: 2; }
  .partner { fill: #dcebd3; stroke: #667085; stroke-width: 2; }
  .edge { fill: none; stroke: #667085; stroke-width: 2.5; marker-end: url(#arrow); }
  .heading { fill: #101828; font: 600 25px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
  .label { fill: #101828; font: 500 22px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
  .note { fill: #3b6ea8; font: 600 22px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
</style>
</defs>
<rect class="frame" x="20" y="20" width="580" height="400" rx="12"/>
<text class="heading" x="310" y="62">vLLM: one sequence per pair</text>
<rect class="anchor" x="50" y="90.0" width="300" height="60" rx="10"/>
<text class="label" x="200" y="120">Anchor KV</text>
<rect class="partner" x="410" y="90.0" width="160" height="60" rx="10"/>
<text class="label" x="490" y="120">Partner 1</text>
<path class="edge" d="M 408 120 L 354 120"/>
<rect class="anchor" x="50" y="180.0" width="300" height="60" rx="10"/>
<text class="label" x="200" y="210">Anchor KV</text>
<rect class="partner" x="410" y="180.0" width="160" height="60" rx="10"/>
<text class="label" x="490" y="210">Partner 2</text>
<path class="edge" d="M 408 210 L 354 210"/>
<rect class="anchor" x="50" y="270.0" width="300" height="60" rx="10"/>
<text class="label" x="200" y="300">Anchor KV</text>
<rect class="partner" x="410" y="270.0" width="160" height="60" rx="10"/>
<text class="label" x="490" y="300">Partner 3</text>
<path class="edge" d="M 408 300 L 354 300"/>
<text class="note" x="310" y="390">same anchor KV read 3 times</text>
<rect class="frame" x="640" y="20" width="580" height="400" rx="12"/>
<text class="heading" x="930" y="62">Quail: partners share the anchor</text>
<rect class="anchor" x="670" y="165" width="300" height="90" rx="10"/>
<text class="label" x="820" y="210">Anchor KV</text>
<rect class="partner" x="1030" y="90.0" width="160" height="60" rx="10"/>
<text class="label" x="1110" y="120">Partner 1</text>
<path class="edge" d="M 1028 120 L 974 185"/>
<rect class="partner" x="1030" y="180.0" width="160" height="60" rx="10"/>
<text class="label" x="1110" y="210">Partner 2</text>
<path class="edge" d="M 1028 210 L 974 210"/>
<rect class="partner" x="1030" y="270.0" width="160" height="60" rx="10"/>
<text class="label" x="1110" y="300">Partner 3</text>
<path class="edge" d="M 1028 300 L 974 235"/>
<text class="note" x="930" y="390">anchor KV read once</text>
</svg>
