<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">Quail architecture</title>
  <desc id="desc">The query frontend creates a logical plan. The query planner estimates dataset statistics and sets the forward pass token budget before applying SQL query rewrites using estimated costs. It then lowers AI operations into physical operators, plans their execution and KV reuse, and produces a physical plan. The execution engine runs the physical plan and executes its AI operations on the GPU.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <marker id="arrow-both" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #667085; stroke-width: 2; }
      .input { fill: #f2f4f7; stroke: #667085; stroke-width: 2; }
      .plan { fill: #dbe7f7; stroke: #667085; stroke-width: 2; }
      .planner { fill: #dbe7f7; stroke: #667085; stroke-width: 2; }
      .rewrite-group { fill: #f5f8fd; stroke: #8ba6c9; stroke-width: 2; }
      .rewrite { fill: #ffffff; stroke: #8ba6c9; stroke-width: 2; }
      .cpu { fill: #f5f8fd; stroke: #8ba6c9; stroke-width: 2; }
      .gpu { fill: #f5faf2; stroke: #8fad7d; stroke-width: 2; }
      .edge { fill: none; stroke: #667085; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-both { fill: none; stroke: #667085; stroke-width: 2.5; marker-start: url(#arrow-both); marker-end: url(#arrow-both); }
      .section { fill: #101828; font: 600 31px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .label { fill: #101828; font: 500 24px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #344054; font: 500 21px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .tiny { fill: #344054; font: 500 23px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .group-title { fill: #101828; font: 600 26px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .zone { fill: #101828; font: 600 27px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .divider { stroke: #d0d5dd; stroke-width: 2; }
    </style>
  </defs>

  <rect class="frame" x="25" y="25" width="1750" height="590" rx="12"/>
  <line class="divider" x1="520" y1="25" x2="520" y2="615"/>
  <line class="divider" x1="1480" y1="25" x2="1480" y2="615"/>

  <g aria-label="Query frontend">
    <rect class="input" x="50" y="150" width="220" height="70" rx="10"/>
    <text class="tiny" x="160" y="174">Arrow table</text>
    <text class="tiny" x="160" y="198">or dataset</text>

    <rect class="input" x="50" y="285" width="220" height="70" rx="10"/>
    <text class="tiny" x="160" y="309">AI-SQL or</text>
    <text class="tiny" x="160" y="333">Python API</text>

    <rect class="plan" x="320" y="245" width="170" height="110" rx="10"/>
    <text class="label" x="405" y="286">Logical</text>
    <text class="label" x="405" y="320">plan</text>

    <path class="edge" d="M 270 185 L 320 270"/>
    <path class="edge" d="M 270 320 L 320 320"/>

    <rect class="input" x="50" y="465" width="220" height="70" rx="10"/>
    <text class="label" x="160" y="501">Model and GPU</text>
  </g>

  <g aria-label="Query planner">
    <rect class="planner" x="540" y="150" width="180" height="100" rx="10"/>
    <text class="tiny" x="630" y="174">Estimate</text>
    <text class="tiny" x="630" y="200">dataset</text>
    <text class="tiny" x="630" y="226">statistics</text>

    <rect class="planner" x="540" y="350" width="180" height="100" rx="10"/>
    <text class="tiny" x="630" y="374">Set</text>
    <text class="tiny" x="630" y="400">forward pass</text>
    <text class="tiny" x="630" y="426">token budget</text>

    <rect class="rewrite-group" x="770" y="90" width="230" height="420" rx="12"/>
    <text class="group-title" x="885" y="116">SQL query</text>
    <text class="group-title" x="885" y="143">rewrites</text>

    <rect class="rewrite" x="790" y="155" width="190" height="75" rx="9"/>
    <text class="tiny" x="885" y="181">Projection and</text>
    <text class="tiny" x="885" y="208">filter pushdown</text>

    <rect class="rewrite" x="790" y="265" width="190" height="75" rx="9"/>
    <text class="tiny" x="885" y="303">Filter ordering</text>

    <rect class="rewrite" x="790" y="375" width="190" height="95" rx="9"/>
    <text class="tiny" x="885" y="397">Join ordering</text>
    <text class="tiny" x="885" y="423">and anchor</text>
    <text class="tiny" x="885" y="449">selection</text>

    <rect class="rewrite-group" x="1040" y="135" width="230" height="330" rx="12"/>
    <text class="group-title" x="1155" y="160">Inference</text>
    <text class="group-title" x="1155" y="188">rewrites</text>

    <rect class="rewrite" x="1060" y="205" width="190" height="85" rx="9"/>
    <text class="tiny" x="1155" y="235">Lower AI</text>
    <text class="tiny" x="1155" y="262">operators</text>

    <rect class="rewrite" x="1060" y="330" width="190" height="85" rx="9"/>
    <text class="tiny" x="1155" y="360">Plan execution</text>
    <text class="tiny" x="1155" y="387">and KV reuse</text>

    <rect class="plan" x="1320" y="245" width="130" height="110" rx="10"/>
    <text class="label" x="1385" y="286">Physical</text>
    <text class="label" x="1385" y="320">plan</text>

    <path class="edge" d="M 270 185 L 540 200"/>
    <path class="edge" d="M 270 500 L 540 400"/>
    <path class="edge" d="M 490 300 L 770 300"/>
    <path class="edge" d="M 720 200 L 770 200"/>
    <path class="edge" d="M 720 400 L 770 400"/>
    <path class="edge" d="M 1000 300 L 1040 300"/>
    <path class="edge" d="M 1270 300 L 1320 300"/>
  </g>

  <g aria-label="Execution engine">
    <rect class="cpu" x="1500" y="245" width="100" height="110" rx="10"/>
    <text class="zone" x="1550" y="302">CPU</text>

    <rect class="gpu" x="1650" y="245" width="100" height="110" rx="10"/>
    <text class="zone" x="1700" y="302">GPU</text>

    <path class="edge" d="M 1450 300 L 1500 300"/>
    <path class="edge-both" d="M 1600 300 L 1650 300"/>
  </g>

  <text class="section" x="260" y="675">Query frontend</text>
  <text class="section" x="1000" y="675">Query planner</text>
  <text class="section" x="1625" y="675">Execution engine</text>
</svg>
