<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">One attention step for a join</title>
  <desc id="desc">Partner-specific suffix tokens are sent to causal attention over the suffix and to attention over shared anchor KV. The two results are merged exactly and quantized by one fused Triton kernel before a DeepGEMM output projection.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #667085; stroke-width: 2; }
      .input { fill: #f2f4f7; stroke: #667085; stroke-width: 2; }
      .attention { fill: #dcebd3; stroke: #8fad7d; stroke-width: 2; }
      .fused { fill: #dbe7f7; stroke: #8ba6c9; stroke-width: 2; }
      .edge { fill: none; stroke: #667085; stroke-width: 2.5; marker-end: url(#arrow); }
      .heading { fill: #101828; font: 600 24px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .label { fill: #101828; font: 500 21px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #344054; font: 400 17px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="frame" x="20" y="20" width="1160" height="310" rx="12"/>
  <text class="heading" x="600" y="58">One join attention step</text>

  <rect class="input" x="55" y="90" width="220" height="70" rx="10"/>
  <text class="label" x="165" y="116">Partner-specific</text>
  <text class="label" x="165" y="140">suffix tokens</text>

  <rect class="input" x="55" y="215" width="220" height="70" rx="10"/>
  <text class="label" x="165" y="251">Shared anchor KV</text>

  <rect class="attention" x="345" y="90" width="250" height="70" rx="10"/>
  <text class="label" x="470" y="116">FlashAttention 3</text>
  <text class="small" x="470" y="142">within partner suffix</text>

  <rect class="attention" x="345" y="215" width="250" height="70" rx="10"/>
  <text class="label" x="470" y="241">FlashAttention 3</text>
  <text class="small" x="470" y="267">partner suffix → anchor KV</text>

  <rect class="fused" x="675" y="140" width="245" height="95" rx="10"/>
  <text class="label" x="798" y="174">Exact merge</text>
  <text class="small" x="798" y="204">+ FP8 quantization</text>
  <text class="small" x="798" y="222">one Triton kernel</text>

  <rect class="attention" x="985" y="152" width="160" height="70" rx="10"/>
  <text class="label" x="1065" y="178">DeepGEMM</text>
  <text class="small" x="1065" y="204">output projection</text>

  <path class="edge" d="M 275 125 L 339 125"/>
  <path class="edge" d="M 275 125 C 315 125, 305 250, 339 250"/>
  <path class="edge" d="M 275 250 L 339 250"/>
  <path class="edge" d="M 601 125 C 640 125, 640 165, 669 165"/>
  <path class="edge" d="M 601 250 C 640 250, 640 210, 669 210"/>
  <path class="edge" d="M 926 188 L 979 188"/>
</svg>
